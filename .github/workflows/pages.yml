name: pages

# Publication du site sur GitHub Pages (CAR-N-14 : hébergement statique gratuit,
# en ligne jusqu'au 29 janvier 2027 au moins).
#
# Déclenché sur `main` seulement : le build ne bloque jamais le verdict de 5
# minutes d'une PR (règle CI-BUDGET-5MIN), il tourne après le merge. Aucune
# ressource distante n'est chargée par le site : le mode enregistré fonctionne
# sans service tiers.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dépendances
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          npm ci --no-audit --no-fund --prefer-offline

      - name: Build du site
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          npm run build
          test -f apps/web/dist/index.html

      # Les constructions interdites (eval, new Function, innerHTML) sont
      # contrôlées sur les SOURCES par le job `ci` : dans un paquet minifié,
      # ces motifs apparaissent dans la bibliothèque React elle-même et un
      # grep sur `dist` ne produirait que des faux positifs. Ici on garde ce
      # qui est propre au site publié : aucune ressource distante, donc le
      # mode enregistré fonctionne sans service tiers (CAR-N-14).
      - name: "Garde : le site publié ne charge rien de distant"
        shell: bash
        run: |
          if grep -Eo 'src="https?://|href="https?://' apps/web/dist/index.html; then
            echo "::error::le site publié référence une ressource distante (CAR-N-14)"
            exit 1
          fi
          echo "site publié : aucune ressource distante"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
