name: CI

# CI du monorepo Cardwake. Le check publié s'appelle `ci` (c'est le nom du job
# qui nomme le check) : il est exigé par le ruleset de `main` et par la file
# Mergify, comme `ci-budget` et `couche0`.
#
# Budget : 5 minutes au plus (règle user du budget CI de 5 minutes, relevé antérieur, hors de cet arbre).
# Pour tenir ce budget, le build du site (`vite build`) n'est PAS dans la CI de
# PR : il tourne sur `main` dans `deploy.yml`. Ici : installation, types,
# tests, gardes — tout en parallèle de rien, mais en un seul job pour que le
# verdict soit unique.
#
# Aucun appel réel à un modèle dans la CI (CAR-N-09) : les tests utilisent le
# mode enregistré ou un faux modèle.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Runners self-hosted persistants : nettoyer le workspace, mais garder
      # `node_modules` — un `npm ci` complet à chaque PR ne tient pas dans le
      # budget de 5 minutes.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Nettoyage du workspace (node_modules conservé)
        shell: bash
        run: git clean -ffdx -e node_modules -e '**/node_modules'

      - name: Dépendances
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          if [ -d node_modules ] && [ -f node_modules/.package-lock.json ]; then
            npm ci --no-audit --no-fund --prefer-offline || npm ci --no-audit --no-fund
          else
            npm ci --no-audit --no-fund
          fi

      - name: Types (tsc --noEmit)
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          npm run typecheck

      - name: Tests (vitest)
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          CI=1 CARDWAKE_PROP_RUNS=100 npm run test:ci

      - name: Gardes du projet (eval, marques, secrets, tailles)
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          python3 scripts/guards/run_all.py

      - name: Sanity docs (UTF-8, non vides)
        shell: bash
        run: |
          python3 - <<'EOF'
          import pathlib
          exts = {".md", ".mdx", ".txt"}
          vides, illisibles, total = [], [], 0
          for f in sorted(pathlib.Path(".").rglob("*")):
              p = f.as_posix()
              if ".git/" in p or "node_modules/" in p or f.suffix.lower() not in exts:
                  continue
              total += 1
              try:
                  contenu = f.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  illisibles.append(p)
                  continue
              if not contenu.strip():
                  vides.append(p)
          print("%d doc(s) contrôlé(s)" % total)
          for f in illisibles:
              print("::error::illisible en UTF-8 : %s" % f)
          for f in vides:
              print("::error::document vide : %s" % f)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF

      # Les gardes de la CI se testent elles-mêmes : couche0 + agents
      # de conflit — stdlib, quelques secondes, aucun réseau.
      - name: Tests des gardes CI (couche0, agents)
        shell: bash
        run: |
          python3 .github/couche0/test_check_couche0.py
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_test_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py
