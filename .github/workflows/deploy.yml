name: deploy

# Build du site hors PR (règle CI-BUDGET-5MIN : le build long ne bloque pas le
# verdict de 5 minutes). Deux usages :
# - sur `main`, produire `apps/web/dist` et le publier en artefact ;
# - à la demande, vérifier qu'un build passe avant une publication.
#
# L'hébergement statique lui-même (CAR-N-14) est branché plus tard : ce job
# prouve seulement que le site se construit, et garde l'artefact à disposition.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: [self-hosted, linux, x64, cardwake-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Environnement
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          node -v

      - name: Dépendances
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          npm ci --no-audit --no-fund --prefer-offline

      - name: Build du site
        shell: bash
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          # Le site n'existe pas encore tant que le lot C5 n'est pas livré :
          # autant le dire que faire rougir `main` pour rien.
          if [ ! -f apps/web/index.html ]; then
            echo "apps/web/index.html absent : build du site ignoré (lot C5 à venir)"
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          npm run build

      - name: Garde : aucune construction dangereuse dans le site produit
        if: env.SKIP_BUILD != '1'
        shell: bash
        run: |
          if grep -rEl 'eval\(|new Function|innerHTML' apps/web/dist 2>/dev/null; then
            echo "::error::le site construit contient une construction interdite (CAR-N-01)"
            exit 1
          fi
          echo "site produit : 0 construction interdite"

      - uses: actions/upload-artifact@v4
        if: env.SKIP_BUILD != '1'
        with:
          name: cardwake-web
          path: apps/web/dist
          retention-days: 30
          if-no-files-found: error
